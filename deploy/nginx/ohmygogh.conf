# Oh my Gogh! — host Nginx config (Ubuntu: /etc/nginx/sites-available/ohmygogh)
# certbot rewrites these blocks for TLS: run scripts/provision.sh first, then
#   certbot --nginx -d <storefront-domain> -d api.<storefront-domain>
#
# NOTE: served on a staging domain until the user signs off on pointing
# ohmygogh.com here — replace server_name values accordingly.

# --- storefront: static files ------------------------------------------
server {
    listen 80;
    server_name ohmygogh.com www.ohmygogh.com;

    root /var/www/ohmygogh;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}

# --- backend API + Medusa Admin ----------------------------------------
server {
    listen 80;
    server_name api.ohmygogh.com;

    client_max_body_size 20m;   # product photo uploads

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }
}
