# Cloudflare Pages config for the marketplace branch.
#
# READ BEFORE MERGING: a committed wrangler.toml makes Cloudflare treat this file as the
# source of truth for the Pages project, and the dashboard bindings screen becomes read-only.
# Replace every REPLACE_WITH_... value (see DEPLOY_MARKETPLACE.md) before a deployment of this
# branch can work. Do NOT merge this file into waitlist-launch until the resources exist.
#
# Secrets (ADMIN_TOKEN) are never put in this file. Set them in the dashboard or with
# `wrangler pages secret put`.

name = "ohmygogh"
pages_build_output_dir = "waitlist"
compatibility_date = "2024-09-23"

[vars]
SITE_URL = "https://ohmygogh.com"
# PBKDF2 iterations for NEW password hashes (Workers allow at most 100000).
PBKDF2_ITERATIONS = "100000"

# Existing waitlist store (unchanged). Needed here because a wrangler.toml replaces dashboard bindings.
[[kv_namespaces]]
binding = "WAITLIST"
id = "f94f4a965f0f42ebb08225e85b66ffbc"
preview_id = "d87d1d5af8d1459c84b48a086ed037c2"

# Marketplace database: artists, products, sessions.
[[d1_databases]]
binding = "DB"
database_name = "ohmygogh-marketplace"
database_id = "674f8c20-77a9-46f6-b9c4-2920fb82013e"
preview_database_id = "674f8c20-77a9-46f6-b9c4-2920fb82013e"
migrations_dir = "migrations"

# Marketplace images: product photos and avatars.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "ohmygogh-images"
preview_bucket_name = "ohmygogh-images"
